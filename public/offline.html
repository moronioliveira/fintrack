<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0f17" />
<title>Sem conexão · FinTrack</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f17; color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #94a3b8; font-size: 14px; max-width: 300px; margin: 0 auto 24px; line-height: 1.5; }
  button { background: #6366f1; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>Você está sem conexão</h1>
    <p>O FinTrack precisa de internet para mostrar seus dados atualizados. Verifique a conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p style="margin-top:32px;font-size:11px;color:#64748b">Um produto <strong style="color:#e5e7eb;letter-spacing:.04em">SOLID <span style="color:#FF6B00">SOLUTIONS</span></strong></p>
  </main>
</body>
</html>
